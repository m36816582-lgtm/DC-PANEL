<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion utilisateurs</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/common.js"></script>
    <script src="../js/api.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🛡️ DC BOT HUB</div>
        <nav id="menu"></nav>
        <button onclick="logout()" class="logout-btn">🚪 Déconnexion</button>
    </div>
    <div class="main">
        <h1>👥 Gestion des utilisateurs</h1>
        
        <div class="add-form">
            <h3>➕ Créer un utilisateur</h3>
            <input type="text" id="discordId" placeholder="ID Discord">
            <input type="text" id="discordTag" placeholder="Nom#1234">
            <input type="email" id="email" placeholder="Email">
            <select id="level">
                <option value="1">Niveau 1 - Utilisateur</option>
                <option value="2">Niveau 2 - Modérateur</option>
                <option value="3">Niveau 3 - Admin Blacklist</option>
                <option value="4">Niveau 4 - Admin Partenaires</option>
                <option value="5">Niveau 5 - Super Admin</option>
            </select>
            <button onclick="createUser()">Créer</button>
        </div>

        <table id="users-table">
            <thead><tr><th>ID Discord</th><th>Tag</th><th>Email</th><th>Niveau</th><th>Statut</th><th>Date</th><th>Action</th></tr></thead>
            <tbody></tbody>
         </table>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const level = parseInt(localStorage.getItem('level'));
        if (level < 5) window.location.href = '../dashboard.html';

        const menuItems = [
            { href: '../dashboard.html', icon: '📊', label: 'Dashboard', minLevel: 1 },
            { href: '../profile.html', icon: '👤', label: 'Mon profil', minLevel: 1 },
            { href: 'users.html', icon: '👥', label: 'Utilisateurs', minLevel: 5 },
            { href: 'blacklist.html', icon: '📋', label: 'Blacklist', minLevel: 3 },
            { href: 'partners.html', icon: '🤝', label: 'Partenaires', minLevel: 4 },
            { href: 'contracts.html', icon: '📄', label: 'Contrats', minLevel: 4 },
            { href: 'accreditations.html', icon: '🔑', label: 'Accréditations', minLevel: 5 },
            { href: 'logs.html', icon: '📜', label: 'Logs', minLevel: 5 }
        ];
        document.getElementById('menu').innerHTML = menuItems.filter(i => level >= i.minLevel).map(i => `<a href="${i.href}">${i.icon} ${i.label}</a>`).join('');

        async function loadUsers() {
            const users = await apiCall('/admin/users');
            const tbody = document.querySelector('#users-table tbody');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td><code>${u.discordId || '-'}</code></td>
                    <td>${u.discordTag || '-'}</td>
                    <td>${u.email || '-'}</td>
                    <td>Niveau ${u.level}</td>
                    <td>${u.active ? '✅ Actif' : '❌ Inactif'}</td>
                    <td>${new Date(u.createdAt).toLocaleDateString()}</td>
                    <td><button onclick="toggleUser('${u._id}')">${u.active ? 'Désactiver' : 'Activer'}</button>
                        <button onclick="deleteUser('${u._id}')">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        async function createUser() {
            const discordId = document.getElementById('discordId').value;
            const discordTag = document.getElementById('discordTag').value;
            const email = document.getElementById('email').value;
            const level = document.getElementById('level').value;
            
            const data = await apiCall('/admin/users/create', {
                method: 'POST',
                body: JSON.stringify({ discordId, discordTag, email, level: parseInt(level) })
            });
            if (data.success) {
                alert('Utilisateur créé ! Un MP lui a été envoyé sur Discord.');
                loadUsers();
            } else {
                alert('Erreur : ' + data.error);
            }
        }

        async function toggleUser(id) {
            await apiCall('/admin/users/toggle', { method: 'POST', body: JSON.stringify({ id }) });
            loadUsers();
        }

        async function deleteUser(id) {
            if (confirm('Supprimer cet utilisateur ?')) {
                await apiCall('/admin/users/delete', { method: 'POST', body: JSON.stringify({ id }) });
                loadUsers();
            }
        }

        loadUsers();
    </script>
</body>
</html>
